title: OAuth2 Token Issued for client_credentials Without Client Secret
id: 96cbfcb9-fc2a-4190-94b9-25a9360a81a1
status: experimental
description: |
    The defect we confirmed on the district SSO: `POST /oauth/token` with `grant_type=client_credentials` and no `client_secret` returns a bearer token. This is an application-log rule, not a web-log rule — it needs the authorization server's own log line where the grant type, client id, secret presence and outcome are all visible.
references:
    - https://github.com/jiwoochris/artex-global/blob/main/docs/defense-en.md
author: damarw (derived from authorized pentest findings)
date: 2026-11-17
tags:
    - attack.credential-access
    - attack.t1528
logsource:
    category: application
    product: sso
detection:
    selection:
        event.action: 'token_issued'
        grant_type: 'client_credentials'
        client_secret_present: false
        outcome: 'success'
    condition: selection
falsepositives:
    - Public clients that are *supposed* to use client_credentials without a secret — per the
      OAuth specification that combination does not exist; if you see it, it is a defect.
level: high
